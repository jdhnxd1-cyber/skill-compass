<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Compass 🧭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Rakkas&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#1c2b3a;
    --parchment:#f2e8d5;
    --parchment-dark:#e6d7b8;
    --sea:#0d2740;
    --sea-deep:#061422;
    --gold:#c8992e;
    --gold-bright:#e7b84b;
    --coral:#c8593f;
    --teal:#2f6b6a;
    --line: rgba(28,43,58,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(120,180,220,0.06), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(80,140,190,0.05), transparent 45%),
      var(--sea);
    color:var(--parchment);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 14px 60px;
    overflow-x:hidden;
    position:relative;
  }
  .map-bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
    background:var(--sea-deep);
  }
  .map-bg svg{
    width:100%;
    height:100%;
  }
  .app{
    width:100%;
    max-width:480px;
    position:relative;
    z-index:1;
  }
  /* ---------- header / compass ---------- */
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
  }
  .compass-wrap{
    width:46px; height:46px; position:relative;
  }
  .compass-rose{
    width:100%; height:100%;
    transition: transform 1s cubic-bezier(.6,.1,.3,1);
    filter: drop-shadow(0 0 6px rgba(231,184,75,0.5));
  }
  .brand h1{
    font-family:'Rakkas', serif;
    font-size:26px;
    color:var(--gold-bright);
    letter-spacing:0.5px;
  }
  /* ---------- progress path ---------- */
  .path{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:26px;
    padding:0 4px;
  }
  .path .dot{
    width:11px; height:11px; border-radius:50%;
    background:var(--parchment-dark);
    opacity:0.35;
    border:2px solid transparent;
    transition: all .4s ease;
    flex-shrink:0;
  }
  .path .dot.active{
    opacity:1;
    background:var(--gold-bright);
    box-shadow:0 0 8px rgba(231,184,75,0.7);
    transform:scale(1.25);
  }
  .path .dot.done{ opacity:0.9; background:var(--teal); }
  .path .seg{
    flex:1;
    height:2px;
    background: repeating-linear-gradient(90deg, var(--parchment-dark) 0 6px, transparent 6px 11px);
    opacity:0.35;
  }
  .path .seg.done{ opacity:0.9; background:var(--teal); }

  /* ---------- card ---------- */
  .card{
    background: var(--parchment);
    color:var(--ink);
    border-radius:18px;
    padding:26px 22px 24px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(28,43,58,0.08);
    position:relative;
    background-image:
      radial-gradient(rgba(28,43,58,0.05) 1px, transparent 1px);
    background-size:14px 14px;
    animation: rise .5s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    font-size:12px;
    letter-spacing:1px;
    color:var(--coral);
    font-weight:700;
    margin-bottom:6px;
  }
  .card h2{
    font-family:'Rakkas', serif;
    font-size:22px;
    margin-bottom:4px;
    color:var(--sea);
  }
  .card p.sub{
    font-size:13.5px;
    color:rgba(28,43,58,0.65);
    margin-bottom:20px;
    line-height:1.6;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin:14px 0 6px;
    color:var(--sea);
  }
  input[type=text], input[type=email], input[type=number], textarea, select{
    width:100%;
    border:1.5px solid rgba(28,43,58,0.2);
    background:rgba(255,255,255,0.6);
    border-radius:10px;
    padding:11px 13px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border .2s, background .2s;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--gold);
    background:#fff;
  }
  textarea{ min-height:110px; resize:vertical; line-height:1.6; }

  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  .grad-toggle{
    display:flex; align-items:center; gap:8px; margin-top:8px;
    font-size:13px; color:var(--sea); font-weight:600;
  }
  .grad-toggle input{ width:16px; height:16px; accent-color:var(--coral); }

  .upload-box{
    border:2px dashed rgba(28,43,58,0.3);
    border-radius:12px;
    padding:16px;
    text-align:center;
    font-size:13px;
    color:rgba(28,43,58,0.6);
    margin-top:8px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .upload-box:hover{ border-color:var(--gold); background:rgba(200,153,46,0.08); }
  .upload-box.filled{ border-color:var(--teal); color:var(--teal); font-weight:700; background:rgba(47,107,106,0.08); }
  input[type=file]{ display:none; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:22px;
    padding:14px 18px;
    border:none;
    border-radius:12px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:var(--sea-deep);
    font-family:inherit;
    font-weight:900;
    font-size:15.5px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(200,153,46,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 22px rgba(200,153,46,0.45); }
  .btn:active{ transform:translateY(0); }
  .btn.secondary{
    background:transparent;
    color:var(--sea);
    box-shadow:none;
    border:1.5px solid rgba(28,43,58,0.25);
    margin-top:10px;
  }
  .btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

  .err{ color:var(--coral); font-size:12.5px; margin-top:8px; font-weight:700; }

  /* ---------- landing ---------- */
  .landing{ text-align:center; padding:10px 4px 4px; }
  .landing .big-compass{ width:130px; height:130px; margin:6px auto 18px; animation: spin-slow 40s linear infinite; }
  @keyframes spin-slow{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .landing h1{
    font-family:'Rakkas', serif;
    font-size:34px;
    color:var(--gold-bright);
    margin-bottom:8px;
  }
  .landing p{ font-size:14.5px; color:rgba(242,232,213,0.75); line-height:1.8; max-width:380px; margin:0 auto 26px; }
  .landing .feat{
    display:flex; flex-direction:column; gap:10px; margin:0 auto 28px; max-width:360px; text-align:right;
  }
  .landing .feat div{
    background:rgba(242,232,213,0.06);
    border:1px solid rgba(242,232,213,0.12);
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
    display:flex; align-items:center; gap:10px;
  }

  /* ---------- loading ---------- */
  .loading{ text-align:center; padding:50px 10px; }
  .loading .compass-rose{ width:70px; height:70px; margin:0 auto 20px; animation: seek 1.6s ease-in-out infinite; }
  @keyframes seek{ 0%{transform:rotate(0deg);} 50%{transform:rotate(190deg);} 100%{transform:rotate(360deg);} }
  .loading h2{ font-family:'Rakkas', serif; font-size:20px; color:var(--sea); margin-bottom:6px;}
  .loading p{ font-size:13px; color:rgba(28,43,58,0.6); }

  /* ---------- results ---------- */
  .result-hero{
    text-align:center; margin-bottom:6px;
  }
  .result-hero .eyebrow{ text-align:center; }
  .result-hero h2{ font-size:24px; }
  .result-hero p.sub{ margin-bottom:6px; }

  .stop{
    position:relative;
    padding:16px 16px 16px 16px;
    margin-top:16px;
    border-radius:14px;
    background:#fff;
    box-shadow:0 3px 10px rgba(28,43,58,0.08), inset 0 0 0 1px rgba(28,43,58,0.06);
  }
  .stop::before{
    content:"";
    position:absolute;
    right:-8px; top:22px;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--sea);
    border:3px solid var(--parchment);
  }
  .stop h3{
    font-family:'Rakkas', serif;
    font-size:16.5px;
    color:var(--sea);
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:12.5px;
    padding:7px 11px;
    border-radius:20px;
    background:rgba(23,48,73,0.06);
    border:1px solid rgba(23,48,73,0.12);
    line-height:1.5;
  }
  .chip.accredited{ background:rgba(47,107,106,0.12); border-color:rgba(47,107,106,0.3); color:var(--teal); font-weight:700;}
  .chip.free{ background:rgba(200,89,63,0.08); border-color:rgba(200,89,63,0.25); color:var(--coral); font-weight:700;}
  .badge{
    font-size:10.5px;
    padding:2px 7px;
    border-radius:8px;
    margin-right:6px;
    font-weight:900;
  }
  .badge.yes{ background:var(--teal); color:#fff; }
  .badge.no{ background:rgba(28,43,58,0.15); color:var(--sea); }
  .place-item{ font-size:13.5px; padding:9px 0; border-bottom:1px dashed rgba(28,43,58,0.15); }
  .place-item:last-child{ border-bottom:none; }
  .place-item b{ color:var(--sea); }
  .place-item .type{ font-size:11.5px; color:var(--coral); font-weight:700; }
  .market-box{ font-size:13.5px; line-height:1.9; color:var(--ink); }
  .timeframe{
    display:inline-block; margin-top:6px; background:var(--gold); color:var(--sea-deep);
    padding:6px 14px; border-radius:20px; font-weight:900; font-size:13px;
  }
  ul.tips{ padding-right:18px; font-size:13.5px; line-height:2; }

  .foot-actions{ display:flex; gap:10px; margin-top:22px; }
  .foot-actions .btn{ margin-top:0; }

  /* ---------- login / save note ---------- */
  .link-btn{
    background:none; border:none; color:var(--parchment);
    text-decoration:underline; font-family:inherit; font-size:13.5px;
    cursor:pointer; opacity:0.85; margin-top:4px;
  }
  .link-btn:hover{ opacity:1; }
  .save-note{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:rgba(28,43,58,0.55);
    margin-top:14px; text-align:center; justify-content:center;
  }
  .login-toggle{ text-align:center; margin-top:14px; }
</style>
</head>

<script>
/* ---------------- State ---------------- */
const state = {
  step: 0, // 0 landing, 1 identity, 2 academic, 3 courses, 4 loading, 5 results
  name:'', email:'',
  university:'', college:'', department:'', year:'', graduated:false,
  courses:'', fileText:'', fileName:'',
  result: null,
  error:'',
  savedOk: false
};

const COMPASS_SVG = `
<svg class="compass-rose" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#e7b84b" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#e7b84b" stroke-width="1" opacity="0.5"/>
  <g stroke="#e7b84b" stroke-width="1" opacity="0.6">
    <line x1="50" y1="4" x2="50" y2="14"/>
    <line x1="50" y1="86" x2="50" y2="96"/>
    <line x1="4" y1="50" x2="14" y2="50"/>
    <line x1="86" y1="50" x2="96" y2="50"/>
  </g>
  <polygon points="50,14 58,50 50,86 42,50" fill="#e7b84b"/>
  <polygon points="14,50 50,42 86,50 50,58" fill="#c8593f"/>
  <circle cx="50" cy="50" r="5" fill="#f2e8d5" stroke="#1c2b3a" stroke-width="1.5"/>
</svg>`;

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'brand';
  if(state.step >= 1 && state.step <= 3){
    header.innerHTML = `<div class="compass-wrap">${COMPASS_SVG}</div><h1>Skill Compass</h1>`;
  }
  if(state.step >=1 && state.step <=3){
    app.appendChild(header);
    app.appendChild(buildPath());
  }

  let view;
  if(state.step === 0) view = viewLanding();
  else if(state.step === 'login') view = viewLogin();
  else if(state.step === 1) view = viewIdentity();
  else if(state.step === 2) view = viewAcademic();
  else if(state.step === 3) view = viewCourses();
  else if(state.step === 4) view = viewLoading();
  else if(state.step === 5) view = viewResults();
  app.appendChild(view);
}

function buildPath(){
  const wrap = document.createElement('div');
  wrap.className = 'path';
  const total = 3;
  for(let i=1;i<=total;i++){
    const dot = document.createElement('div');
    dot.className = 'dot' + (i===state.step ? ' active' : (i<state.step ? ' done':''));
    wrap.appendChild(dot);
    if(i<total){
      const seg = document.createElement('div');
      seg.className = 'seg' + (i<state.step ? ' done':'');
      wrap.appendChild(seg);
    }
  }
  return wrap;
}

/* ---------------- Views ---------------- */
function viewLanding(){
  const d = document.createElement('div');
  d.className = 'landing';
  d.innerHTML = `
    <div class="big-compass">${COMPASS_SVG}</div>
    <h1>Skill Compass 🧭</h1>
    <p>خريطتك الشخصية من أول ما تدخل الكلية لحد سوق الشغل. هنرشحلك كورسات وشهادات وأماكن تدريب على حسب كليتك والمواد اللي بتدرسها، عشان تتخرج وسيرتك الذاتية جاهزة فعلاً للسوق.</p>
    <div class="feat">
      <div>🧭 <span>خريطة تفاعلية بتوريك طريقك خطوة بخطوة</span></div>
      <div>🎓 <span>كورسات وشهادات معتمدة وغير معتمدة على حسب قسمك</span></div>
      <div>🏭 <span>أماكن تدريب: شركات، مصانع، معامل حسب كليتك</span></div>
      <div>📈 <span>احتياجات السوق الحالية والمهارات المطلوبة</span></div>
    </div>
  `;
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = 'ابدأ الرحلة 🧭';
  btn.onclick = ()=>{ state.step = 1; render(); };
  d.appendChild(btn);

  const loginWrap = document.createElement('div');
  loginWrap.className = 'login-toggle';
  loginWrap.innerHTML = `<button class="link-btn" id="go-login">عندي خريطة محفوظة بالفعل، أدخلها 🔑</button>`;
  d.appendChild(loginWrap);
  loginWrap.querySelector('#go-login').onclick = ()=>{ state.step='login'; render(); };
  return d;
}

function viewLogin(){
  const c = fieldCard(`
    <div class="eyebrow">تسجيل الدخول</div>
    <h2>ارجع لخريطتك</h2>
    <p class="sub">اكتب نفس الإيميل اللي استخدمته قبل كده عشان نرجعلك بياناتك ونتيجتك.</p>
    <label>البريد الإلكتروني</label>
    <input type="email" id="f-login-email" placeholder="example@email.com">
    <div class="err" id="err"></div>
  `);
  const back = document.createElement('button');
  back.className='btn secondary'; back.textContent='رجوع';
  back.onclick=()=>{ state.step=0; render(); };

  const btn = document.createElement('button');
  btn.className='btn'; btn.textContent='دخول';
  btn.onclick = async ()=>{
    const email = c.querySelector('#f-login-email').value.trim();
    const errBox = c.querySelector('#err');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      errBox.textContent = 'اكتب إيميل صحيح.';
      return;
    }
    btn.disabled = true; btn.textContent = 'بندور على خريطتك...';
    const profile = await loadProfile(email);
    btn.disabled = false; btn.textContent = 'دخول';
    if(!profile){
      errBox.textContent = 'مفيش خريطة محفوظة بالإيميل ده. جرب تبدأ رحلة جديدة.';
      return;
    }
    Object.assign(state, profile);
    state.error = '';
    state.savedOk = true;
    state.step = profile.result ? 5 : 1;
    render();
  };
  c.appendChild(back);
  c.appendChild(btn);
  return c;
}

function fieldCard(inner){
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = inner;
  return c;
}

function viewCourses(){
  const c = fieldCard(`
    <div class="eyebrow">المحطة الثالثة</div>
    <h2>إيه اللي بتدرسه؟</h2>
    <p class="sub">اكتب أسماء المواد اللي بتدرسها دلوقتي أو درستها، أو ارفع ملف PDF لخطة المنهج/الشهادة الدراسية.</p>
    <label>المواد الدراسية</label>
    <textarea id="f-courses" placeholder="مثال: هياكل بيانات، قواعد بيانات، شبكات، ...">${state.courses}</textarea>
    <label>أو ارفع ملف PDF</label>
    <div class="upload-box ${state.fileName ? 'filled':''}" id="upload-box">
      ${state.fileName ? ('✅ تم رفع: '+state.fileName) : '📄 اضغط هنا لرفع ملف PDF'}
    </div>
    <input type="file" id="f-file" accept="application/pdf">
    <div class="err" id="err"></div>
  `);
  const uploadBox = c.querySelector('#upload-box');
  const fileInput = c.querySelector('#f-file');
  uploadBox.onclick = ()=> fileInput.click();
  fileInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    uploadBox.textContent = '⏳ بنقرأ الملف...';
    try{
      const text = await extractPdfText(file);
      state.fileText = text;
      state.fileName = file.name;
      uploadBox.textContent = '✅ تم رفع: '+file.name;
      uploadBox.classList.add('filled');
    }catch(err){
      uploadBox.textContent = '⚠️ ما قدرناش نقرأ الملف، اكتب المواد يدويًا بدل كده';
    }
  };

  const back = document.createElement('button');
  back.className='btn secondary'; back.textContent='رجوع';
  back.onclick=()=>{ state.step=2; render(); };

  const btn = document.createElement('button');
  btn.className='btn'; btn.textContent='ارسم خريطتي 🧭';
  btn.onclick = ()=>{
    state.courses = c.querySelector('#f-courses').value.trim();
    if(!state.courses && !state.fileText){
      c.querySelector('#err').textContent = 'اكتب المواد أو ارفع ملف عشان نقدر نرشحلك بدقة.';
      return;
    }
    state.step = 4; render();
    generateRecommendations();
  };
  c.appendChild(back);
  c.appendChild(btn);
  return c;
}

function viewResults(){
  const c = document.createElement('div');
  c.className = 'card';
  if(state.error){
    c.innerHTML = `
      <div class="eyebrow">حصل عائق</div>
      <h2>معرفناش نرسم الخريطة</h2>
      <p class="sub">${state.error}</p>
    `;
    const retry = document.createElement('button');
    retry.className='btn'; retry.textContent='حاول تاني';
    retry.onclick = ()=>{ state.step=4; render(); generateRecommendations(); };
    c.appendChild(retry);
    return c;
  }

  const r = state.result || {};
  const courses = r.courses || [];
  const certs = r.certificates || [];
  const places = r.training_places || [];
  const tips = r.cv_tips || [];

  c.innerHTML = `
    <div class="result-hero">
      <div class="eyebrow">خريطتك جاهزة يا ${escapeHtml(state.name)}</div>
      <h2>مسارك نحو ${escapeHtml(state.department || 'تخصصك')}</h2>
      <p class="sub">${escapeHtml(state.college)} — ${escapeHtml(state.university)}</p>
      ${r.roadmap_years ? `<span class="timeframe">🕒 محتاج تقريبًا: ${escapeHtml(r.roadmap_years)}</span>` : ''}
    </div>

    <div class="stop">
      <h3>🎓 كورسات مقترحة</h3>
      <div class="chip-row">
        ${courses.map(x=>`<span class="chip ${x.accredited?'accredited':'free'}">${x.accredited?'<span class="badge yes">معتمد</span>':'<span class="badge no">غير معتمد</span>'} ${escapeHtml(x.name)}${x.provider? ' — '+escapeHtml(x.provider):''}</span>`).join('') || '<span class="chip">لا توجد بيانات كافية</span>'}
      </div>
    </div>

    <div class="stop">
      <h3>📜 شهادات يُنصح بها</h3>
      <div class="chip-row">
        ${certs.map(x=>`<span class="chip ${x.accredited?'accredited':'free'}">${x.accredited?'<span class="badge yes">معتمدة</span>':'<span class="badge no">غير معتمدة</span>'} ${escapeHtml(x.name)}${x.provider? ' — '+escapeHtml(x.provider):''}</span>`).join('') || '<span class="chip">لا توجد بيانات كافية</span>'}
      </div>
    </div>

    <div class="stop">
      <h3>🏭 أماكن تدريب مقترحة</h3>
      ${places.map(x=>`<div class="place-item"><span class="type">${escapeHtml(x.type||'')}</span> · <b>${escapeHtml(x.name)}</b><br>${escapeHtml(x.note||'')}</div>`).join('') || '<div class="place-item">لا توجد بيانات كافية</div>'}
    </div>

    <div class="stop">
      <h3>📈 احتياجات السوق الحالي</h3>
      <div class="market-box">${escapeHtml(r.market_needs || 'لا توجد بيانات كافية حاليًا.')}</div>
    </div>

    ${tips.length ? `
    <div class="stop">
      <h3>✅ نصائح لسيرتك الذاتية</h3>
      <ul class="tips">${tips.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul>
    </div>` : ''}
  `;

  const note = document.createElement('div');
  note.className = 'save-note';
  if(state.savedOk){
    note.innerHTML = `💾 خريطتك محفوظة على إيميلك، تقدر ترجعلها في أي وقت من "عندي خريطة محفوظة بالفعل".`;
    c.appendChild(note);
  } else {
    note.innerHTML = `⚠️ معرفناش نحفظ خريطتك دلوقتي، لكن النتيجة قدامك هنا. تقدر تحاول تحفظها تاني.`;

    const retrySave = document.createElement('button');

    retrySave.textContent = 'حاول تحفظ الخريطة تاني';
    retrySave.onclick = async ()=>{
      retrySave.disabled = true; retrySave.textContent = 'بنحفظ...';
      state.savedOk = await saveProfile();
      render();
    };
    c.appendChild(retrySave);
  }

  const foot = document.createElement('div');
  foot.className='foot-actions';
  const restart = document.createElement('button');
  restart.className='btn secondary'; restart.textContent='رحلة جديدة';
  restart.onclick = ()=>{
    Object.assign(state, {step:0, name:'', email:'', university:'', college:'', department:'', year:'', graduated:false, courses:'', fileText:'', fileName:'', result:null, error:'', savedOk:false});
    render();
  };
  foot.appendChild(restart);
  c.appendChild(foot);
  return c;
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- Persistent storage ---------------- */
async function saveProfile(){
  if(!state.email) return false;
  const payload = {
    name: state.name, email: state.email,
    university: state.university, college: state.college, department: state.department,
    year: state.year, graduated: state.graduated,
    courses: state.courses, fileName: state.fileName,
    result: state.result,
    savedAt: new Date().toISOString()
  };
  for(let attempt=0; attempt<2; attempt++){
    try{
      const resp = await fetch('/api/save-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: state.email, payload })
      });
      if(resp.ok) return true;
    }catch(err){
      console.error('تعذر حفظ البيانات (محاولة ' + (attempt+1) + '):', err);
    }
    await new Promise(r=>setTimeout(r, 400));
  }
  return false;
}

async function loadProfile(email){
  try{
    const resp = await fetch('/api/load-profile?email=' + encodeURIComponent(email.trim().toLowerCase()));
    if(!resp.ok) return null;
    return await resp.json();
  }catch(err){
    return null;
  }
}

/* ---------------- PDF extraction ---------------- */
async function extractPdfText(file){
  const arrayBuffer = await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let text = '';
  const maxPages = Math.min(pdf.numPages, 15);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text.slice(0, 6000);
}

/* ---------------- AI Recommendation call ---------------- */
async function generateRecommendations(){
  try{
    const response = await fetch('/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        university: state.university,
        college: state.college,
        department: state.department,
        year: state.year,
        graduated: state.graduated,
        courses: state.courses,
        fileText: state.fileText
      })
    });
    const data = await response.json();
    if(!response.ok || data.error){
      throw new Error(data.error || ('HTTP ' + response.status));
    }
    state.result = data;
    state.error = '';
    state.savedOk = await saveProfile();
  }catch(err){
    state.error = 'حصلت مشكلة في تحليل بياناتك. (تفاصيل تقنية: ' + err.message + ') جرب تاني كمان شوية.';
  }
  state.step = 5;
  render();
}

render();
</script>
