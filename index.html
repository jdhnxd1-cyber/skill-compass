<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Compass - التوجيه المهني</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #result {
            margin-top: 25px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Skill Compass</h1>
        <p class="subtitle">المنصة الذكية لتحليل المناهج الأكاديمية وترشيح الوظائف</p>
        
        <div class="form-group">
            <label>اسم الجامعة والكلية/التخصص:</label>
            <input type="text" id="university" placeholder="مثال: جامعة بني سويف التكنولوجية - تكنولوجيا الكهرباء">
        </div>

        <div class="form-group">
            <label>أدخل المواد والمقررات الدراسية:</label>
            <textarea id="courses" placeholder="مثال: التحكم الآلي، برمجة PLC، الدوائر الكهربائية..."></textarea>
        </div>

        <button id="analyzeBtn">تحليل المنهج وتوليد التقرير 🚀</button>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const university = document.getElementById('university').value;
            const courses = document.getElementById('courses').value;
            const resultDiv = document.getElementById('result');

            if (!university || !courses) {
                alert('من فضلك ادخل اسم الجامعة والمواد الدراسية أولاً!');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerText = 'جاري تحليل المنهج وإعداد التقرير بواسطة الذكطء الاصطناعي... ⏳';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `الجامعة والتخصص: ${university}\nالمواد: ${courses}` })
                });

                const data = await response.json();

                if (data.result) {
                    resultDiv.innerText = data.result;
                } else {
                    resultDiv.innerText = 'خطأ: ' + (data.error || 'حدث خطأ غير معروف');
                }
            } catch (err) {
                resultDiv.innerText = 'فشل الاتصال بالخادم: ' + err.message;
            }
        });
    </script>
</body>
</html>
