const STEP_ICONS = [Flag, GraduationCap, BookOpen, Trophy];
const STEP_COLORS = [BRASS, TEAL, SEAL, "#6FCF6F"];

function MapTrail({ step, labels, dir }) {
  const n = labels.length;
  const pts = labels.map((_, i) => {
    const x = 6 + (i / (n - 1)) * 88;
    const y = 22 + 14 * Math.sin((i / (n - 1)) * Math.PI * 1.4 + 0.3);
    return { x, y };
  });
  const toD = (arr) => arr.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(" ");

  return (
    <div className="relative mb-12" dir="ltr">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none" className="w-full h-14 sm:h-16 block">
        <path d={toD(pts)} fill="none" stroke="#2A3A5C" strokeWidth="0.6" strokeDasharray="1.6 2.2" />
        {pts.slice(0, -1).map((p, i) => {
          if (i >= step) return null;
          const seg = [pts[i], pts[i + 1]];
          return (
            <path
              key={i}
              d={toD(seg)}
              fill="none"
              stroke={STEP_COLORS[i + 1]}
              strokeWidth="0.8"
              strokeDasharray="1.6 2.2"
              style={{ transition: "opacity 0.5s ease" }}
            />
          );
        })}
      </svg>
      <div className="absolute inset-0">
        {labels.map((label, i) => {
          const Icon = STEP_ICONS[i] || MapPin;
          const p = pts[i];
          const color = STEP_COLORS[i] || BRASS;
          return (
            <div
              key={label}
              className="flex flex-col items-center gap-1"
              style={{ position: "absolute", left: `${p.x}%`, top: `${(p.y / 40) * 100}%`, transform: "translate(-50%,-50%)" }}
            >
              <div
                className="w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center border-2 transition-all duration-500"
                style={{
                  borderColor: color,
                  backgroundColor: i <= step ? color : "#182544",
                  boxShadow: i === step ? `0 0 0 5px ${color}33` : "none",
                }}
              >
                <Icon size={14} style={{ color: i <= step ? INK : color }} />
              </div>
              <span
                className="text-[9px] sm:text-[11px] tracking-wide whitespace-nowrap hidden sm:block"
                style={{ color: i <= step ? PARCHMENT : "#5C6889", fontFamily: "'JetBrains Mono', monospace" }}
              >
                {label}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CompassMark({ step }) {
  const angle = step * 133;
  return (
    <div className="relative w-16 h-16 shrink-0">
      <svg viewBox="0 0 100 100" className="w-full h-full" style={{ filter: `drop-shadow(0 0 8px ${BRASS}77)` }}>
        <circle cx="50" cy="50" r="46" fill="none" stroke={BRASS} strokeWidth="3" />
        <circle cx="50" cy="50" r="38" fill="none" stroke={BRASS} strokeWidth="1" opacity="0.55" />
        {[...Array(16)].map((_, i) => {
          const a = (i * 22.5 * Math.PI) / 180;
          const r1 = i % 4 === 0 ? 33 : 36.5;
          return (
            <line
              key={i}
              x1={50 + 38 * Math.sin(a)} y1={50 - 38 * Math.cos(a)}
              x2={50 + r1 * Math.sin(a)} y2={50 - r1 * Math.cos(a)}
              stroke={BRASS} strokeWidth="1" opacity="0.5"
            />
          );
        })}
        <g style={{ transform: `rotate(${angle}deg)`, transformOrigin: "50px 50px", transition: "transform 0.9s cubic-bezier(0.34,1.56,0.64,1)" }}>
          <polygon points="50,9 63,50 50,91 37,50" fill={SEAL} />
          <polygon points="50,9 63,50 50,50" fill="#ffffff" opacity="0.18" />
          <polygon points="50,50 50,91 37,50" fill="#000000" opacity="0.12" />
        </g>
        <circle cx="50" cy="50" r="9" fill={PARCHMENT} stroke={BRASS} strokeWidth="2" />
      </svg>
    </div>
  );
}

function ReadinessRing({ score, reason, label, dir }) {
  const r = 42;
  const circ = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, score));
  const offset = circ - (pct / 100) * circ;
  return (
    <div
      className="rounded-xl p-6 mb-6 flex flex-col sm:flex-row items-center gap-5"
      style={{ background: "#182544", border: `1px solid ${OCEAN_DEEP}33` }}
      dir={dir}
    >
      <div className="relative w-28 h-28 shrink-0">
        <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90">
          <defs>
            <linearGradient id="readinessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor={OCEAN_DEEP} />
              <stop offset="55%" stopColor={BRASS} />
              <stop offset="100%" stopColor={OCEAN_LIGHT} />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r={r} fill="none" stroke="#2A3A5C" strokeWidth="8" />
          <circle
            cx="50" cy="50" r={r} fill="none" stroke="url(#readinessGrad)" strokeWidth="8"
            strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
            style={{ transition: "stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1)" }}
          />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond', serif", fontSize: "1.6rem", fontWeight: 700, lineHeight: 1 }}>
            {pct}%
          </span>
        </div>
      </div>
      <div className="text-center sm:text-start">
        <h3 className="font-semibold mb-1" style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.15rem" }}>
          {label}
        </h3>
        <p className="text-sm" style={{ color: "#C7CCDA" }}>{reason}</p>
      </div>
    </div>
  );
}

function SkillCompass() {
  const [lang, setLang] = useState("ar");
  const [step, setStep] = useState(0);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [results, setResults] = useState(null);
  const [apiError, setApiError] = useState(null);
  const [pdfLoading, setPdfLoading] = useState(false);
  const [pdfError, setPdfError] = useState(null);
  const [form, setForm] = useState({
    name: "", email: "", university: "", college: "", department: "", year: "", courses: "",
  });

  async function loadPdfJs() {
    if (window.pdfjsLib) return window.pdfjsLib;
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = resolve;
      s.onerror = () => reject(new Error("pdfjs load failed"));
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    return window.pdfjsLib;
  }

  async function handlePdfFile(file) {
    if (!file) return;
    setPdfLoading(true);
    setPdfError(null);
    try {
      const pdfjsLib = await loadPdfJs();
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map((it) => it.str).join(" ") + "\n";
      }
      text = text.trim();
      if (!text) throw new Error("empty pdf text");
      setForm((f) => ({ ...f, courses: f.courses ? f.courses + "\n" + text : text }));
    } catch (e) {
      console.error(e);
      setPdfError(t.pdfErr);
    } finally {
      setPdfLoading(false);
    }
  }

  const t = STR[lang];
  const dir = t.dir;
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));

  const stepValid = () => {
    if (step === 0) return form.name.trim() && form.email.trim();
    if (step === 1) return form.university.trim() && form.college.trim() && form.department.trim() && form.year.trim();
    if (step === 2) return form.courses.trim();
    return true;
  };

  const goNext = () => {
    if (!stepValid()) { setError(t.required); return; }
    setError(null);
    if (step === 2) { setStep(3); generate(); }
    else setStep((s) => s + 1);
  };
  const goBack = () => { setError(null); setStep((s) => Math.max(0, s - 1)); };

  async function generate() {
    setLoading(true);
    setError(null);
    const languageInstruction = lang === "ar"
      ? "Respond in formal, classical Modern Standard Arabic (فصحى), no colloquial dialect."
      : "Respond in formal English.";
    const schemaHint = lang === "ar"
      ? `"type" values must be exactly "معتمد" or "غير معتمد"`
      : `"type" values must be exactly "Certified" or "Not certified"`;

    const profile = `Student profile:
University: ${form.university}
College: ${form.college}
Department: ${form.department}
Academic year: ${form.year}
Current/upcoming courses: ${form.courses}
Current year: 2026`;

    const promptA = `${profile}

Based on this profile and current global job market trends for this field, generate personalized recommendations. Return ONLY valid JSON, no markdown fences, no preamble, matching exactly this schema:

{
  "readinessScore": 0,
  "readinessReason": "",
  "courses": [{"title": "", "type": "", "provider": "", "reason": ""}],
  "certificates": [{"title": "", "type": "", "issuer": "", "reason": ""}]
}

Rules:
- "readinessScore": an honest integer 0-100 estimating how ready this specific student is for the job market RIGHT NOW given their year and courses so far (not a generic number — a first-year student should score low, a final-year student with strong courses should score higher).
- "readinessReason": one short sentence explaining the score, max 14 words.
- Exactly 4 items in "courses" and exactly 4 items in "certificates".
- ${schemaHint}
- Every string value must be short: titles/names max 6 words, provider/issuer max 3 words, reason max 9 words.
- Never use quotation marks (" or ' or « » or “ ”) inside any string value.
- ${languageInstruction}
- Output raw JSON only, nothing before or after it. A complete, valid, shorter JSON is far better than a longer truncated one.`;

    const promptB = `${profile}

Based on this profile and current global job market trends for this field, generate personalized recommendations. Return ONLY valid JSON, no markdown fences, no preamble, matching exactly this schema:

{
  "trainingPlaces": [{"name": "", "sector": "", "reason": ""}],
  "jobRoles": [{"title": "", "reason": ""}],
  "marketOutlook": ""
}

Rules:
- Exactly 4 items in "trainingPlaces" and exactly 4 items in "jobRoles".
- "trainingPlaces" must be concrete types of companies/factories/labs/sites relevant to this exact department (not generic).
- "marketOutlook": one short sentence, max 20 words, on where this field is heading over the next few years.
- Every string value must be short: titles/names max 6 words, sector max 3 words, reason max 9 words.
- Never use quotation marks (" or ' or « » or “ ”) inside any string value.
- ${languageInstruction}
- Output raw JSON only, nothing before or after it. A complete, valid, shorter JSON is far better than a longer truncated one.`;

    async function callModel(userPrompt) {
      const response = await fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: "You are an expert academic and career-readiness advisor who tailors recommendations precisely to a student's actual major and coursework. You always respond with raw JSON only, matching the requested schema exactly, and nothing else.",
          prompt: userPrompt,
        }),
      });

      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error(`HTTP ${response.status}`);
      }

      if (data.error) throw new Error(data.error.message || "API error");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const textBlock = (data.content || []).find((b) => b.type === "text");
      if (!textBlock || !textBlock.text) throw new Error("Empty response from model");

      let raw = textBlock.text.trim().replace(/```json|```/g, "").trim();
      const first = raw.indexOf("{");
      const last = raw.lastIndexOf("}");
      if (first === -1 || last === -1) {
        if (data.stop_reason === "max_tokens") throw new Error("truncated");
        throw new Error("No JSON found in model output");
      }
      try {
        return JSON.parse(raw.slice(first, last + 1));
      } catch (parseErr) {
        if (data.stop_reason === "max_tokens") throw new Error("truncated");
        throw parseErr;
      }
    }

    async function runBoth() {
      const [partA, partB] = await Promise.all([callModel(promptA), callModel(promptB)]);
      if (!partA.courses || !partA.certificates || typeof partA.readinessScore !== "number") {
        throw new Error("Incomplete data (part A)");
      }
      if (!partB.trainingPlaces || !partB.jobRoles || !partB.marketOutlook) {
        throw new Error("Incomplete data (part B)");
      }
      return { ...partA, ...partB };
    }

    try {
      let parsed;
      try {
        parsed = await runBoth();
      } catch (firstErr) {
        console.warn("first attempt failed, retrying once:", firstErr);
        parsed = await runBoth();
      }
      setResults(parsed);
      setStep(4);
    } catch (e) {
      console.error(e);
      setApiError(e.message || "unknown error");
    } finally {
      setLoading(false);
    }
  }

  const restart = () => {
    setForm({ name: "", email: "", university: "", college: "", department: "", year: "", courses: "" });
    setResults(null);
    setError(null);
    setStep(0);
  };

  const Chevron = dir === "rtl" ? ChevronLeft : ChevronRight;
  const BackChevron = dir === "rtl" ? ChevronRight : ChevronLeft;

  return (
    <div dir={dir} style={{ backgroundColor: INK, minHeight: "100vh", fontFamily: lang === "ar" ? "'Tajawal', sans-serif" : "'Inter', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
        .sc-bg {
          position: relative;
          background-color: ${INK};
          background-image:
            linear-gradient(#233256 1px, transparent 1px),
            linear-gradient(90deg, #233256 1px, transparent 1px),
            radial-gradient(circle at 50% 22%, #D9A73E22 0%, transparent 45%),
            radial-gradient(circle at 15% 75%, #3FA7C71c 0%, transparent 40%),
            radial-gradient(circle at 85% 60%, #D9A73E15 0%, transparent 40%);
          background-size: 44px 44px, 44px 44px, auto, auto, auto;
          overflow: hidden;
        }
        .sc-fadein { animation: scFade 0.5s ease both; }
        @keyframes scFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .sc-fadein { animation: none; } }
        body { margin: 0; }
      `}</style>

      <div className="sc-bg min-h-screen px-4 py-10 sm:py-14">
        <MapBlobs />
        <div className="max-w-3xl mx-auto relative" style={{ zIndex: 1 }}>
          <div className="flex items-center justify-between mb-10">
            <div className="flex items-center gap-3">
              <CompassMark step={step} />
              <div>
                <h1 style={{
                  background: BLUE_GRADIENT, WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent",
                  fontFamily: "'Cormorant Garamond', 'Amiri', serif", fontSize: "1.7rem", fontWeight: 700, lineHeight: 1,
                }}>
                  {t.brand}
                </h1>
                <p className="text-xs mt-1" style={{ color: "#8B93AC", fontFamily: "'JetBrains Mono', monospace" }}>{t.tagline}</p>
              </div>
            </div>
            <button
              onClick={() => setLang(lang === "ar" ? "en" : "ar")}
              className="text-xs px-3 py-1.5 rounded-full border transition-colors"
              style={{ borderColor: BRASS, color: BRASS }}
            >
              {t.langBtn}
            </button>
          </div>

          <MapTrail step={step} labels={t.steps} dir={dir} />

          <div className="sc-fadein" key={step}>
            {step === 0 && (
              <div className="rounded-xl p-6 sm:p-8" style={{ backgroundColor: "#182544", border: "1px solid #2A3A5C" }}>
                <h2 style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.5rem", fontWeight: 600 }}>{t.s0_title}</h2>
                <p className="text-sm mb-6" style={{ color: "#8B93AC" }}>{t.s0_sub}</p>
                <Field icon={User} label={t.name} value={form.name} onChange={set("name")} />
                <Field icon={Mail} label={t.email} value={form.email} onChange={set("email")} type="email" />
              </div>
            )}

            {step === 1 && (
              <div className="rounded-xl p-6 sm:p-8" style={{ backgroundColor: "#182544", border: "1px solid #2A3A5C" }}>
                <h2 style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.5rem", fontWeight: 600 }}>{t.s1_title}</h2>
                <p className="text-sm mb-6" style={{ color: "#8B93AC" }}>{t.s1_sub}</p>
                <Field icon={Building2} label={t.university} value={form.university} onChange={set("university")} />
                <Field icon={GraduationCap} label={t.college} value={form.college} onChange={set("college")} />
                <Field icon={BookOpen} label={t.department} value={form.department} onChange={set("department")} />
                <Field icon={MapPin} label={t.year} value={form.year} onChange={set("year")} placeholder={t.yearHint} />
              </div>
            )}

            {step === 2 && (
              <div className="rounded-xl p-6 sm:p-8" style={{ backgroundColor: "#182544", border: "1px solid #2A3A5C" }}>
                <h2 style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.5rem", fontWeight: 600 }}>{t.s2_title}</h2>
                <p className="text-sm mb-6" style={{ color: "#8B93AC" }}>{t.s2_sub}</p>
                <textarea
                  value={form.courses}
                  onChange={(e) => set("courses")(e.target.value)}
                  placeholder={t.coursesPlaceholder}
                  rows={7}
                  className="w-full px-4 py-3 rounded-md outline-none mb-3"
                  style={{ backgroundColor: "#1C2A4A", border: "1px solid #2A3A5C", color: PARCHMENT, fontFamily: "'JetBrains Mono', monospace", fontSize: "0.9rem" }}
                />
                <label
                  className="inline-flex items-center gap-2 text-xs px-3 py-2 rounded-md w-fit cursor-pointer"
                  style={{ border: `1px dashed ${BRASS}`, color: BRASS }}
                >
                  {pdfLoading ? <Loader2 size={14} className="animate-spin" /> : <Upload size={14} />}
                  {pdfLoading ? t.readingPdf : t.uploadPdf}
                  <input
                    type="file"
                    accept="application/pdf"
                    className="hidden"
                    onChange={(e) => handlePdfFile(e.target.files[0])}
                  />
                </label>
                {pdfError && (
                  <p className="text-xs mt-2" style={{ color: SEAL }}>{pdfError}</p>
                )}
              </div>
            )}

            {step === 3 && (
              <div className="rounded-xl p-10 sm:p-14 flex flex-col items-center justify-center gap-4 text-center" style={{ backgroundColor: "#182544", border: "1px solid #2A3A5C" }}>
                {!apiError ? (
                  <>
                    <Loader2 size={32} className="animate-spin" style={{ color: BRASS }} />
                    <h2 style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.3rem" }}>{t.s3_title}</h2>
                    <p className="text-sm" style={{ color: "#8B93AC" }}>{t.s3_sub}</p>
                  </>
                ) : (
                  <>
                    <AlertTriangle size={28} style={{ color: SEAL }} />
                    <h2 style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.3rem" }}>{t.genErrTitle}</h2>
                    <p className="text-xs" style={{ color: "#8B93AC", fontFamily: "'JetBrains Mono', monospace" }}>{apiError}</p>
                    <div className="flex items-center gap-3 mt-2">
                      <button
                        onClick={() => { setApiError(null); generate(); }}
                        className="flex items-center gap-1.5 text-sm font-medium px-5 py-2 rounded-md"
                        style={{ background: BLUE_GRADIENT, color: INK }}
                      >
                        <RotateCcw size={14} /> {t.tryAgain}
                      </button>
                      <button
                        onClick={() => { setApiError(null); setStep(2); }}
                        className="text-sm px-4 py-2 rounded-md"
                        style={{ color: "#8B93AC" }}
                      >
                        {t.editData}
                      </button>
                    </div>
                  </>
                )}
              </div>
            )}

            {step === 4 && results && (
              <div>
                <div className="text-center mb-8">
                  <h2 style={{ color: PARCHMENT, fontFamily: "'Cormorant Garamond','Amiri',serif", fontSize: "1.7rem", fontWeight: 700 }}>{t.s4_title}</h2>
                  <p className="text-sm mt-1" style={{ color: "#8B93AC" }}>{t.s4_sub(form.name)}</p>
                </div>

                <ReadinessRing
                  score={results.readinessScore}
                  reason={results.readinessReason}
                  label={t.readiness}
                  dir={dir}
                />

                <div
                  className="rounded-lg p-5 mb-6 flex items-start gap-3"
                  style={{ backgroundColor: `${TEAL}22`, border: `1px solid ${TEAL}66` }}
                >
                  <TrendingUp size={20} style={{ color: TEAL }} className="mt-0.5 shrink-0" />
                  <div>
                    <h3 className="font-semibold mb-1" style={{ color: PARCHMENT }}>{t.outlook}</h3>
                    <p className="text-sm" style={{ color: "#E9E3CE" }}>{results.marketOutlook}</p>
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 gap-5">
                  <ResultCard icon={BookOpen} title={t.courses} items={results.courses} accent={BRASS} dir={dir} />
                  <ResultCard icon={Award} title={t.certificates} items={results.certificates} accent={SEAL} dir={dir} />
                  <ResultCard icon={Building2} title={t.training} items={results.trainingPlaces} accent={TEAL} dir={dir} />
                  <ResultCard icon={Briefcase} title={t.jobs} items={results.jobRoles} accent={OCEAN_DEEP} dir={dir} />
                </div>

                <div className="text-center mt-8">
                  <button
                    onClick={restart}
                    className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm"
                    style={{ border: `1px solid ${BRASS}`, color: BRASS }}
                  >
                    <RotateCcw size={14} /> {t.restart}
                  </button>
                </div>
              </div>
            )}
          </div>

          {error && step !== 4 && (
            <p className="text-sm mt-3 text-center" style={{ color: SEAL }}>{error}</p>
          )}

          {step < 3 && (
            <div className="flex items-center justify-between mt-6">
              <button
                onClick={goBack}
                disabled={step === 0}
                className="flex items-center gap-1 text-sm px-4 py-2 rounded-md disabled:opacity-30"
                style={{ color: "#8B93AC" }}
              >
                <BackChevron size={16} /> {t.back}
              </button>
              <button
                onClick={goNext}
                className="flex items-center gap-1.5 text-sm font-medium px-6 py-2.5 rounded-md"
                style={{ background: BLUE_GRADIENT, color: INK }}
              >
                {step === 2 ? t.generate : t.next} <Chevron size={16} />
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SkillCompass />);
</script>
</body>
</html>
